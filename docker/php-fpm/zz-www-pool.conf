; Override do pool [www] do PHP-FPM.
;
; A imagem php:8.2-fpm-alpine ja traz /usr/local/etc/php-fpm.d/www.conf com
; pm.max_children = 5. O php-fpm.conf inclui /usr/local/etc/php-fpm.d/*.conf em
; ordem alfabetica, entao este arquivo (zz-www-pool.conf) e lido depois de
; www.conf e zz-docker.conf e vence a definicao anterior.
;
; Nao editar www.conf diretamente: ele pertence a imagem base e e sobrescrito a
; cada rebuild/atualizacao de versao do PHP.

[www]
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
