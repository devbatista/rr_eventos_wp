# Configuração da página de manutenção.
#
# Copiada direto para /etc/nginx/conf.d/default.conf, sem passar por envsubst.
# Não há porta variável a resolver: o serviço no Railway não define `PORT` e o
# domínio aponta para a 80 fixa.

server {
    listen 80;

    # O Railway alcança o container por IPv6. Sem esta linha o container sobe,
    # o serviço aparece "Online" e mesmo assim todo domínio devolve 502 com
    # `x-railway-fallback: true` — o edge não acha ninguém escutando.
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;

    # Os arquivos da própria página respondem 200. Se caíssem no 503 junto com o
    # resto, o navegador ainda os aplicaria, mas viriam com um status que nenhum
    # cache intermediário guarda direito.
    location = /styles.css { try_files $uri =404; }
    location = /script.js  { try_files $uri =404; }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # A página de exemplo da Beauty Fair responde 200 e fica de fora da
    # manutenção — sem esta linha ela cairia no `location /` abaixo e o
    # visitante receberia a página de manutenção no lugar dela.
    #
    # É um arquivo só: o CSS e o JS estão dentro do próprio HTML, então não há
    # um segundo caminho a liberar aqui. As imagens que ela usa já entram por
    # /assets/.
    #
    # O `X-Robots-Tag` repete no cabeçalho o que a página já diz na meta tag.
    # Não é redundância inútil: enquanto o site está em manutenção esta é a
    # única página do domínio que responde 200, e sem isso ela é a candidata
    # natural do buscador para representar o site inteiro.
    location = /beauty-fair-example.html {
        try_files $uri =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Todo o resto é manutenção, inclusive a raiz.
    #
    # O 503 não é detalhe: é ele que diz ao buscador para não indexar esta
    # página no lugar do site, e é ele que o `fetch` do script lê para saber que
    # ainda não voltou. Com 200 aqui o script concluiria que o site subiu e
    # recarregaria em cima de si mesmo, sem parar.
    location / {
        return 503;
    }

    # O corpo do 503 sai de um caminho interno próprio, e não de `/index.html`.
    # Apontar o `error_page` para o próprio /index.html cairia de volta no
    # `location /` acima, que devolve 503 outra vez: o Nginx detecta o ciclo e
    # responde 500 no lugar da página.
    error_page 503 @manutencao;

    location @manutencao {
        try_files /index.html =404;
        add_header Retry-After 600 always;
        add_header Cache-Control "no-store" always;
    }
}
