# Configuração do site.
#
# Copiada direto para /etc/nginx/conf.d/default.conf, sem passar por envsubst.
# Não há porta variável a resolver: o serviço no Railway não define `PORT` e o
# domínio aponta para a 80 fixa.
#
# A manutenção saiu do caminho. Antes tudo caía num `return 503` e a página de
# manutenção era o corpo desse erro; agora a raiz serve a página da Beauty Fair
# normalmente, com 200. O arquivo da manutenção continua na imagem, em
# /index-manut.html, e o rodapé deste arquivo explica como voltar a ligá-la.

server {
    listen 80;

    # O Railway alcança o container por IPv6. Sem esta linha o container sobe,
    # o serviço aparece "Online" e mesmo assim todo domínio devolve 502 com
    # `x-railway-fallback: true` — o edge não acha ninguém escutando.
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # A raiz e o resto dos arquivos. O `index` acima é o que faz `/` entregar o
    # index.html; o `=404` no fim evita que um caminho inexistente devolva a
    # página inicial fingindo que existe.
    location / {
        try_files $uri $uri/ =404;
    }

    # ------------------------------------------------------------------------
    # Para voltar a página de manutenção
    # ------------------------------------------------------------------------
    #
    # Substitua o `location /` acima por estas três peças e o domínio inteiro
    # volta a responder 503 com a página de manutenção, como antes:
    #
    #     location = /styles.css { try_files $uri =404; }
    #     location = /script.js  { try_files $uri =404; }
    #
    #     location / {
    #         return 503;
    #     }
    #
    #     error_page 503 @manutencao;
    #
    #     location @manutencao {
    #         try_files /index-manut.html =404;
    #         add_header Retry-After 600 always;
    #         add_header Cache-Control "no-store" always;
    #     }
    #
    # Três detalhes que custaram a ser descobertos e vale não redescobrir:
    #
    # - o 503 não é capricho. É ele que diz ao buscador para não indexar a
    #   manutenção no lugar do site, e é ele que o `fetch` do script.js lê para
    #   saber se o site voltou. Com 200 na raiz o script concluiria que já
    #   voltou e recarregaria em cima de si mesmo, sem parar;
    # - o `styles.css` e o `script.js` precisam de `location` próprio. Caídos no
    #   503 junto com o resto, o navegador ainda os aplicaria, mas com um status
    #   que nenhum cache intermediário guarda direito;
    # - o corpo do 503 sai de `@manutencao`, e não de um `error_page` apontando
    #   para /index-manut.html direto. Apontado assim ele cairia de volta no
    #   `location /`, que devolve 503 outra vez — o Nginx detecta o ciclo e
    #   responde 500 no lugar da página.
}
